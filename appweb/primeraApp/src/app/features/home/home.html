<section
  class="home-hero -m-8 flex flex-col items-center justify-center gap-6 px-6 text-center"
>

  <img src="DK-LogoHome.webp" alt="Dark Kitchen" class="w-80 max-w-[80vw] object-contain" />

  <p class="max-w-md text-base text-muted-foreground">
    Everything you need to run your kitchen — products, orders and promotions, all in one place.
  </p>

  <a
    [routerLink]="primaryAction().link"
    class="group inline-flex items-center gap-2 bg-primary px-6 py-3 text-base font-medium text-primary-foreground no-underline shadow-lg transition hover:opacity-90 active:opacity-75"
  >
    {{ primaryAction().label }}
    <svg
      class="w-4 h-4 transition-transform group-hover:translate-x-0.5"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <line x1="5" y1="12" x2="19" y2="12" />
      <polyline points="12 5 19 12 12 19" />
    </svg>
  </a>
</section>
