<div class="max-w-2xl space-y-8">
  <h1 class="text-2xl font-semibold text-foreground">Delivery types</h1>

  <!-- Tabla de tipos existentes -->
  <div class="bg-card border border-border shadow-xl overflow-hidden">
    <app-data-state
      [loading]="loading()"
      [empty]="deliveryTypes().length === 0"
      emptyMessage="No registered delivery types."
    >
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-border bg-muted/40">
            <th class="text-left px-6 py-3 font-medium text-muted-foreground">Name</th>
            <th class="text-left px-6 py-3 font-medium text-muted-foreground">Shipping cost</th>
            <th class="px-6 py-3"></th>
          </tr>
        </thead>
        <tbody>
          @for (item of deliveryTypes(); track item.id) {
            <tr class="border-b border-border last:border-0 hover:bg-muted/20 transition">
              <td class="px-6 py-3 text-foreground">{{ item.name }}</td>
              <td class="px-6 py-3 text-foreground">$ {{ item.shippingCost }}</td>
              <td class="px-6 py-3 text-right flex items-center justify-end gap-4">
                @if (can('ManageDeliveryTypes')) {
                <button
                  type="button"
                  (click)="startEdit(item)"
                  aria-label="Edit"
                  class="p-1.5 text-orange-500 hover:bg-orange-500/10 transition"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="w-4 h-4"
                  >
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                  </svg>
                </button>
                <button
                  type="button"
                  (click)="onDelete(item.id)"
                  aria-label="Delete"
                  class="p-1.5 text-red-500 hover:bg-red-500/10 transition"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="w-4 h-4"
                  >
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                    <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                  </svg>
                </button>
                }
              </td>
            </tr>
          }
        </tbody>
      </table>
    </app-data-state>
  </div>

  <!-- Formulario crear / editar -->
  @if (can('ManageDeliveryTypes')) {
  <div class="bg-card border border-border p-8 shadow-xl">
    <h2 class="text-lg font-semibold text-foreground mb-6">New delivery type</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-5">
      <app-alert-banner type="error" [message]="errorMessage()" />

      <app-alert-banner type="success" [message]="successMessage()" />

      <app-form-field
        label="Name"
        for="name"
        [error]="name.touched && name.invalid ? 'Name is required.' : null"
      >
        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="E.g.: Express shipping"
          [class.border-destructive]="name.touched && name.invalid"
          class="input-field"
        />
      </app-form-field>

      <app-form-field
        label="Shipping cost"
        for="shippingCost"
        [error]="
          shippingCost.touched && shippingCost.invalid
            ? shippingCost.errors?.['required']
              ? 'Shipping cost is required.'
              : 'Cost cannot be negative.'
            : null
        "
      >
        <input
          id="shippingCost"
          type="number"
          formControlName="shippingCost"
          placeholder="0.00"
          min="0"
          step="0.01"
          [class.border-destructive]="shippingCost.touched && shippingCost.invalid"
          class="input-field"
        />
      </app-form-field>

      <!-- Botones -->
      <div class="flex gap-3 mt-2">
        <button
          type="submit"
          [disabled]="submitting()"
          class="flex-1 flex items-center justify-center gap-2 bg-primary px-4 py-2.5 text-base font-medium text-primary-foreground transition hover:opacity-90 active:opacity-75 disabled:cursor-not-allowed disabled:opacity-60"
        >
          @if (submitting()) {
            <span
              aria-hidden="true"
              class="h-4 w-4 animate-spin border-2 border-primary-foreground/25 border-t-primary-foreground/70"
            ></span>
            Saving…
          } @else {
            Create
}
        </button>
      </div>
    </form>
  </div>
  }

  <app-modal [open]="showEditModal()" title="Edit delivery type" maxWidth="max-w-md" (close)="cancelEdit()">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-5">
      <app-alert-banner type="error" [message]="modalErrorMessage()" />

      <app-form-field
        label="Name"
        for="modal-name"
        [error]="name.touched && name.invalid ? 'Name is required.' : null"
      >
        <input
          id="modal-name"
          type="text"
          formControlName="name"
          placeholder="E.g.: Express shipping"
          [class.border-destructive]="name.touched && name.invalid"
          class="input-field"
        />
      </app-form-field>

      <app-form-field
        label="Shipping cost"
        for="modal-shippingCost"
        [error]="
          shippingCost.touched && shippingCost.invalid
            ? shippingCost.errors?.['required']
              ? 'Shipping cost is required.'
              : 'Cost cannot be negative.'
            : null
        "
      >
        <input
          id="modal-shippingCost"
          type="number"
          formControlName="shippingCost"
          placeholder="0.00"
          min="0"
          step="0.01"
          [class.border-destructive]="shippingCost.touched && shippingCost.invalid"
          class="input-field"
        />
      </app-form-field>

      <div class="flex gap-3 mt-2">
        <button
          type="submit"
          [disabled]="submitting()"
          class="flex-1 flex items-center justify-center gap-2 bg-primary px-4 py-2.5 text-base font-medium text-primary-foreground transition hover:opacity-90 active:opacity-75 disabled:cursor-not-allowed disabled:opacity-60"
        >
          @if (submitting()) {
            <span
              aria-hidden="true"
              class="h-4 w-4 animate-spin border-2 border-primary-foreground/25 border-t-primary-foreground/70"
            ></span>
            Saving…
          } @else {
            Save changes
          }
        </button>
        <button
          type="button"
          (click)="cancelEdit()"
          class="px-4 py-2.5 border border-border text-sm font-medium text-foreground hover:bg-muted/40 transition"
        >
          Cancel
        </button>
      </div>
    </form>
  </app-modal>
</div>
