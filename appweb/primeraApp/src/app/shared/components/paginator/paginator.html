@if (totalPages() > 1) {
  <div class="flex items-center justify-between gap-4 border-t border-border px-6 py-3 text-sm">
    <span class="text-muted-foreground">
      {{ rangeStart() }}–{{ rangeEnd() }} of {{ totalCount() }}
    </span>
    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="goTo(pageNumber() - 1)"
        [disabled]="pageNumber() <= 1"
        class="px-3 py-1.5 border border-border text-xs font-medium text-foreground hover:bg-muted/40 transition disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Previous
      </button>
      <span class="text-muted-foreground"> Page {{ pageNumber() }} of {{ totalPages() || 1 }} </span>
      <button
        type="button"
        (click)="goTo(pageNumber() + 1)"
        [disabled]="pageNumber() >= totalPages()"
        class="px-3 py-1.5 border border-border text-xs font-medium text-foreground hover:bg-muted/40 transition disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Next
      </button>
    </div>
  </div>
}
