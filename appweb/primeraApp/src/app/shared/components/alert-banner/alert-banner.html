@if (message()) {
  @if (type() === 'success') {
    <div role="status" class="flex items-start gap-3 p-4 bg-green-500/10 border border-green-500/20">
      <svg
        class="w-5 h-5 text-green-500 shrink-0 mt-0.5"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
        <polyline points="22 4 12 14.01 9 11.01" />
      </svg>
      <p class="text-sm text-green-500">{{ message() }}</p>
    </div>
  } @else {
    <div role="alert" class="flex items-start gap-3 p-4 bg-destructive/10 border border-destructive/20">
      <svg
        class="w-5 h-5 text-destructive shrink-0 mt-0.5"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
      <p class="text-sm text-destructive">{{ message() }}</p>
    </div>
  }
}
